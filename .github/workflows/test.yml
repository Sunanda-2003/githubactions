name: Terraform Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::759416136172:role/OIDC-ROLE
          aws-region: us-east-1

      - name: Check AWS Identity
        run: aws sts get-caller-identity

      - name: Check EC2
        run: |
          aws ec2 describe-instances \
            --instance-ids i-0de3cde3b22560d01 \
            --region us-east-1

      - name: Run Command on EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0de3cde3b22560d01" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo Hello from GitHub Actions","hostname","whoami","uptime"]' \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          sleep 5

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0de3cde3b22560d01" \
            --region us-east-1
